name: contrib-chart

on:
  schedule:
    - cron: "30 19 * * *"
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: contrib-chart
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Render contribution svg
        run: node .github/scripts/contrib.mjs
      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
